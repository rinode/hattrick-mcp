app = 'hattrick-mcp'
primary_region = 'ams'

[build]

[processes]
  app = "http"

[env]
  HATTRICK_MCP_ADDR = ":8080"
  XDG_CONFIG_HOME = "/config"

[[mounts]]
  source = "creds"
  destination = "/config"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
