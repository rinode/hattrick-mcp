name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose run --rm test

  bundle:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          build() {
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$3" .
          }
          build darwin arm64 "$RUNNER_TEMP/darwin-arm64"
          build darwin amd64 "$RUNNER_TEMP/darwin-amd64"
          lipo -create -output mcpb/server/hattrick-mcp "$RUNNER_TEMP/darwin-arm64" "$RUNNER_TEMP/darwin-amd64"
          build linux amd64 mcpb/server/hattrick-mcp-linux-amd64
          build linux arm64 mcpb/server/hattrick-mcp-linux-arm64
          build windows amd64 mcpb/server/hattrick-mcp.exe
      - name: Pack bundle
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' mcpb/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" mcpb/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb hattrick-mcp.mcpb
      - run: gh release create "$GITHUB_REF_NAME" hattrick-mcp.mcpb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
