# Example fly.io deploy for a single-user remote Hattrick MCP.
# Rename the app, then:
#   fly launch --copy-config --no-deploy --name <your-app>
#   fly volume create creds --size 1
#   fly secrets set HATTRICK_CONSUMER_KEY=... HATTRICK_CONSUMER_SECRET=... \
#       HATTRICK_MCP_TOKEN=$(openssl rand -hex 32)
#   fly deploy
# Then add https://<your-app>.fly.dev/ as an MCP connector with that bearer token,
# and call the login tool once to store the Hattrick access token on the volume.
app = "hattrick-mcp-example"
primary_region = "ams"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "http"

[env]
  HATTRICK_MCP_ADDR = ":8080"
  XDG_CONFIG_HOME = "/config"

[[mounts]]
  source = "creds"
  destination = "/config"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
