services:
  hattrick-mcp:
    build: .
    environment:
      - HATTRICK_CONSUMER_KEY
      - HATTRICK_CONSUMER_SECRET
    volumes:
      - credentials:/config

  test:
    profiles: [test]
    build:
      context: .
      target: build
    command: sh -c 'test -z "$$(gofmt -l .)" && go mod tidy -diff && go vet ./... && go test ./...'

volumes:
  credentials:
